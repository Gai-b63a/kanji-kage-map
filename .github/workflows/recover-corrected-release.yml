name: Verify and finish corrected release publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/recover-corrected-release.yml]
permissions:
  contents: write
concurrency:
  group: corrected-dataset-release
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify all existing assets and finish publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/recover_corrected_release.py
